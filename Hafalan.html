<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hafalan Juz 30</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5ef;--card:#fff;--tx:#1f2a24;--mut:#6b756f;--ac:#1f7a5a;--acs:#dff1ea;--bd:#e4e1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b2420;--tx:#e8eee9;--mut:#93a09a;--ac:#4fc196;--acs:#1f3a2f;--bd:#2c3832}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b2420;--tx:#e8eee9;--mut:#93a09a;--ac:#4fc196;--acs:#1f3a2f;--bd:#2c3832}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.item.off{opacity:.55;cursor:default}
.no{width:34px;height:34px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.item b{display:block}.item small{color:var(--mut)}
.tag{margin-left:auto;font-size:.75rem;color:var(--ac);white-space:nowrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.ayat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.ar{font-family:Amiri,"Traditional Arabic","Noto Naskh Arabic",serif;font-size:1.9rem;line-height:2.1;direction:rtl;text-align:right;margin:0}
.hide .ar{filter:blur(9px);cursor:pointer;user-select:none}
.hide .ayat.show .ar{filter:none}
.n{display:inline-block;font-size:.75rem;color:var(--ac);background:var(--acs);border-radius:99px;padding:1px 8px;margin-bottom:4px}
.tr{color:var(--mut);font-size:.9rem;margin:6px 0 0}
.noTr .tr{display:none}
.lat{color:var(--ac);font-style:italic;font-size:1rem;margin:6px 0 0}
.noLt .lat{display:none}
.hint{font-size:.8rem;color:var(--mut)}
a.back{color:var(--ac);text-decoration:none;font-size:.95rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
var S=[[78,"An-Naba’",40],[79,"An-Nazi’at",46],[80,"‘Abasa",42],[81,"At-Takwir",29],[82,"Al-Infithar",19],[83,"Al-Muthaffifin",36],[84,"Al-Insyiqaq",25],[85,"Al-Buruj",22],[86,"Ath-Thariq",17],[87,"Al-A’la",19],[88,"Al-Ghasyiyah",26],[89,"Al-Fajr",30],[90,"Al-Balad",20],[91,"Asy-Syams",15],[92,"Al-Lail",21],[93,"Adh-Dhuha",11],[94,"Al-Insyirah",8],[95,"At-Tin",8],[96,"Al-‘Alaq",19],[97,"Al-Qadr",5],[98,"Al-Bayyinah",8],[99,"Az-Zalzalah",8],[100,"Al-‘Adiyat",11],[101,"Al-Qari’ah",11],[102,"At-Takatsur",8],[103,"Al-‘Asr",3],[104,"Al-Humazah",9],[105,"Al-Fil",5],[106,"Quraisy",4],[107,"Al-Ma’un",7],[108,"Al-Kautsar",3],[109,"Al-Kafirun",6],[110,"An-Nasr",3],[111,"Al-Lahab",5],[112,"Al-Ikhlas",4],[113,"Al-Falaq",5],[114,"An-Nas",6]];
var T={
86:[["وَالسَّمَاءِ وَالطَّارِقِ","Demi langit dan yang datang pada malam hari,"],["وَمَا أَدْرَاكَ مَا الطَّارِقُ","dan tahukah engkau apakah yang datang pada malam hari itu?"],["النَّجْمُ الثَّاقِبُ","(Yaitu) bintang yang cahayanya menembus."],["إِنْ كُلُّ نَفْسٍ لَمَّا عَلَيْهَا حَافِظٌ","Tidak ada suatu jiwa pun melainkan ada penjaganya."],["فَلْيَنْظُرِ الْإِنْسَانُ مِمَّ خُلِقَ","Maka hendaklah manusia memperhatikan dari apa dia diciptakan."],["خُلِقَ مِنْ مَاءٍ دَافِقٍ","Dia diciptakan dari air yang memancar,"],["يَخْرُجُ مِنْ بَيْنِ الصُّلْبِ وَالتَّرَائِبِ","yang keluar dari antara tulang punggung (sulbi) dan tulang dada."],["إِنَّهُ عَلَىٰ رَجْعِهِ لَقَادِرٌ","Sungguh, Allah benar-benar kuasa untuk mengembalikannya (hidup setelah mati)."],["يَوْمَ تُبْلَى السَّرَائِرُ","Pada hari ketika segala rahasia dibuka,"],["فَمَا لَهُ مِنْ قُوَّةٍ وَلَا نَاصِرٍ","maka manusia tidak lagi mempunyai suatu kekuatan dan tidak (pula) ada penolong."],["وَالسَّمَاءِ ذَاتِ الرَّجْعِ","Demi langit yang mengandung hujan,"],["وَالْأَرْضِ ذَاتِ الصَّدْعِ","dan bumi yang mempunyai tumbuh-tumbuhan,"],["إِنَّهُ لَقَوْلٌ فَصْلٌ","sungguh, (Al-Qur’an) itu benar-benar firman pemisah (antara yang hak dan yang batil),"],["وَمَا هُوَ بِالْهَزْلِ","dan bukanlah itu senda gurau."],["إِنَّهُمْ يَكِيدُونَ كَيْدًا","Sungguh, mereka (orang kafir) itu merencanakan tipu daya yang jahat dengan sebenar-benarnya,"],["وَأَكِيدُ كَيْدًا","dan Aku pun membalas dengan tipu daya (yang lebih jitu)."],["فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْدًا","Karena itu berilah penangguhan kepada orang-orang kafir itu. Berilah mereka kesempatan untuk sementara waktu."]],
88:[["هَلْ أَتَاكَ حَدِيثُ الْغَاشِيَةِ","Sudahkah sampai kepadamu berita tentang hari Pembalasan?"],["وُجُوهٌ يَوْمَئِذٍ خَاشِعَةٌ","Pada hari itu banyak wajah yang tertunduk terhina,"],["عَامِلَةٌ نَاصِبَةٌ","bekerja keras lagi kepayahan,"],["تَصْلَىٰ نَارًا حَامِيَةً","mereka memasuki api yang sangat panas (neraka),"],["تُسْقَىٰ مِنْ عَيْنٍ آنِيَةٍ","diberi minum dari sumber mata air yang sangat panas."],["لَيْسَ لَهُمْ طَعَامٌ إِلَّا مِنْ ضَرِيعٍ","Tidak ada makanan bagi mereka selain dari pohon yang berduri,"],["لَا يُسْمِنُ وَلَا يُغْنِي مِنْ جُوعٍ","yang tidak menggemukkan dan tidak pula menghilangkan lapar."],["وُجُوهٌ يَوْمَئِذٍ نَاعِمَةٌ","Pada hari itu banyak (pula) wajah yang berseri-seri,"],["لِسَعْيِهَا رَاضِيَةٌ","merasa senang karena usahanya (sendiri),"],["فِي جَنَّةٍ عَالِيَةٍ","dalam surga yang tinggi,"],["لَا تَسْمَعُ فِيهَا لَاغِيَةً","di sana (kamu) tidak mendengar perkataan yang tidak berguna."],["فِيهَا عَيْنٌ جَارِيَةٌ","Di sana ada mata air yang mengalir."],["فِيهَا سُرُرٌ مَرْفُوعَةٌ","Di sana ada dipan-dipan yang ditinggikan,"],["وَأَكْوَابٌ مَوْضُوعَةٌ","dan gelas-gelas yang tersedia (di dekatnya),"],["وَنَمَارِقُ مَصْفُوفَةٌ","dan bantal-bantal sandaran yang tersusun,"],["وَزَرَابِيُّ مَبْثُوثَةٌ","dan permadani-permadani yang terhampar."],["أَفَلَا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ","Maka tidakkah mereka memperhatikan unta, bagaimana diciptakan?"],["وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ","Dan langit, bagaimana ditinggikan?"],["وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ","Dan gunung-gunung bagaimana ditegakkan?"],["وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ","Dan bumi bagaimana dihamparkan?"],["فَذَكِّرْ إِنَّمَا أَنْتَ مُذَكِّرٌ","Maka berilah peringatan, karena sesungguhnya engkau hanyalah pemberi peringatan."],["لَسْتَ عَلَيْهِمْ بِمُصَيْطِرٍ","Engkau bukanlah orang yang berkuasa atas mereka,"],["إِلَّا مَنْ تَوَلَّىٰ وَكَفَرَ","tetapi orang yang berpaling dan kafir,"],["فَيُعَذِّبُهُ اللَّهُ الْعَذَابَ الْأَكْبَرَ","maka Allah akan mengazabnya dengan azab yang besar."],["إِنَّ إِلَيْنَا إِيَابَهُمْ","Sungguh, kepada Kamilah mereka kembali,"],["ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُمْ","kemudian sesungguhnya Kamilah yang memperhitungkan mereka."]],
87:[["سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى","Sucikanlah nama Tuhanmu Yang Mahatinggi,"],["الَّذِي خَلَقَ فَسَوَّىٰ","yang menciptakan, lalu menyempurnakan (ciptaan-Nya),"],["وَالَّذِي قَدَّرَ فَهَدَىٰ","yang menentukan kadar (masing-masing) dan memberi petunjuk,"],["وَالَّذِي أَخْرَجَ الْمَرْعَىٰ","dan yang menumbuhkan rerumputan,"],["فَجَعَلَهُ غُثَاءً أَحْوَىٰ","lalu dijadikan-Nya (rumput-rumput itu) kering kehitam-hitaman."],["سَنُقْرِئُكَ فَلَا تَنْسَىٰ","Kami akan membacakan (Al-Qur’an) kepadamu (Muhammad) maka engkau tidak akan lupa,"],["إِلَّا مَا شَاءَ اللَّهُ ۚ إِنَّهُ يَعْلَمُ الْجَهْرَ وَمَا يَخْفَىٰ","kecuali jika Allah menghendaki. Sungguh, Dia mengetahui yang terang dan yang tersembunyi."],["وَنُيَسِّرُكَ لِلْيُسْرَىٰ","Dan Kami akan memudahkan engkau menuju kemudahan."],["فَذَكِّرْ إِنْ نَفَعَتِ الذِّكْرَىٰ","Oleh karena itu berikanlah peringatan, jika peringatan itu bermanfaat,"],["سَيَذَّكَّرُ مَنْ يَخْشَىٰ","orang yang takut (kepada Allah) akan mendapat pelajaran,"],["وَيَتَجَنَّبُهَا الْأَشْقَى","dan orang yang celaka (kafir) akan menjauhinya."],["الَّذِي يَصْلَى النَّارَ الْكُبْرَىٰ","(Yaitu) orang yang akan memasuki api yang besar (neraka),"],["ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","kemudian dia tidak mati di dalamnya dan tidak (pula) hidup."],["قَدْ أَفْلَحَ مَنْ تَزَكَّىٰ","Sungguh beruntung orang yang menyucikan diri (dengan beriman),"],["وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّىٰ","dan mengingat nama Tuhannya, lalu dia salat."],["بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا","Bahkan kamu (orang-orang kafir) memilih kehidupan dunia,"],["وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ","padahal kehidupan akhirat itu lebih baik dan lebih kekal."],["إِنَّ هَٰذَا لَفِي الصُّحُفِ الْأُولَىٰ","Sungguh, ini terdapat dalam kitab-kitab yang terdahulu,"],["صُحُفِ إِبْرَاهِيمَ وَمُوسَىٰ","(yaitu) kitab-kitab Ibrahim dan Musa."]],
96:[["اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ","Bacalah dengan (menyebut) nama Tuhanmu yang menciptakan,"],["خَلَقَ الْإِنْسَانَ مِنْ عَلَقٍ","Dia menciptakan manusia dari segumpal darah."],["اقْرَأْ وَرَبُّكَ الْأَكْرَمُ","Bacalah, dan Tuhanmulah Yang Mahamulia,"],["الَّذِي عَلَّمَ بِالْقَلَمِ","yang mengajar (manusia) dengan pena."],["عَلَّمَ الْإِنْسَانَ مَا لَمْ يَعْلَمْ","Dia mengajarkan manusia apa yang tidak diketahuinya."],["كَلَّا إِنَّ الْإِنْسَانَ لَيَطْغَىٰ","Sekali-kali tidak! Sungguh, manusia itu benar-benar melampaui batas,"],["أَنْ رَآهُ اسْتَغْنَىٰ","apabila melihat dirinya serba cukup."],["إِنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ","Sungguh, hanya kepada Tuhanmulah tempat kembali(mu)."],["أَرَأَيْتَ الَّذِي يَنْهَىٰ","Bagaimana pendapatmu tentang orang yang melarang"],["عَبْدًا إِذَا صَلَّىٰ","seorang hamba ketika dia melaksanakan salat,"],["أَرَأَيْتَ إِنْ كَانَ عَلَى الْهُدَىٰ","bagaimana pendapatmu jika dia (yang dilarang salat itu) berada di atas kebenaran (petunjuk),"],["أَوْ أَمَرَ بِالتَّقْوَىٰ","atau dia menyuruh bertakwa (kepada Allah)?"],["أَرَأَيْتَ إِنْ كَذَّبَ وَتَوَلَّىٰ","Bagaimana pendapatmu jika dia (yang melarang) itu mendustakan dan berpaling?"],["أَلَمْ يَعْلَمْ بِأَنَّ اللَّهَ يَرَىٰ","Tidakkah dia mengetahui bahwa sesungguhnya Allah melihat (segala perbuatannya)?"],["كَلَّا لَئِنْ لَمْ يَنْتَهِ لَنَسْفَعًا بِالنَّاصِيَةِ","Sekali-kali tidak! Sungguh, jika dia tidak berhenti (berbuat demikian) niscaya Kami tarik ubun-ubunnya,"],["نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ","(yaitu) ubun-ubun orang yang berdusta lagi durhaka."],["فَلْيَدْعُ نَادِيَهُ","Maka biarlah dia memanggil golongannya (untuk menolongnya),"],["سَنَدْعُ الزَّبَانِيَةَ","Kelak Kami akan memanggil Malaikat Zabaniyah (penyiksa orang-orang yang berdosa),"],["كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِبْ","sekali-kali tidak! Janganlah engkau patuh kepadanya; dan sujudlah serta dekatkanlah (dirimu kepada Allah)."]],
92:[["وَاللَّيْلِ إِذَا يَغْشَىٰ","Demi malam apabila menutupi (cahaya siang),"],["وَالنَّهَارِ إِذَا تَجَلَّىٰ","demi siang apabila terang benderang,"],["وَمَا خَلَقَ الذَّكَرَ وَالْأُنْثَىٰ","demi penciptaan laki-laki dan perempuan,"],["إِنَّ سَعْيَكُمْ لَشَتَّىٰ","sungguh, usahamu memang beraneka macam."],["فَأَمَّا مَنْ أَعْطَىٰ وَاتَّقَىٰ","Maka adapun orang yang memberikan (hartanya di jalan Allah) dan bertakwa,"],["وَصَدَّقَ بِالْحُسْنَىٰ","dan membenarkan adanya pahala yang terbaik (surga),"],["فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ","maka akan Kami mudahkan baginya jalan menuju kemudahan (kebahagiaan)."],["وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَىٰ","Dan adapun orang yang kikir dan merasa dirinya cukup (tidak butuh Allah),"],["وَكَذَّبَ بِالْحُسْنَىٰ","serta mendustakan pahala yang terbaik,"],["فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ","maka akan Kami mudahkan baginya jalan menuju kesulitan (kesengsaraan)."],["وَمَا يُغْنِي عَنْهُ مَالُهُ إِذَا تَرَدَّىٰ","Dan hartanya tidak bermanfaat baginya apabila dia telah binasa."],["إِنَّ عَلَيْنَا لَلْهُدَىٰ","Sungguh, Kamilah yang memberi petunjuk,"],["وَإِنَّ لَنَا لَلْآخِرَةَ وَالْأُولَىٰ","dan sungguh, milik Kamilah akhirat dan dunia."],["فَأَنْذَرْتُكُمْ نَارًا تَلَظَّىٰ","Maka Aku memperingatkan kamu dengan api yang menyala-nyala."],["لَا يَصْلَاهَا إِلَّا الْأَشْقَى","Yang hanya dimasuki oleh orang yang paling celaka,"],["الَّذِي كَذَّبَ وَتَوَلَّىٰ","yang mendustakan (kebenaran) dan berpaling (dari iman)."],["وَسَيُجَنَّبُهَا الْأَتْقَى","Dan akan dijauhkan darinya (neraka) orang yang paling bertakwa,"],["الَّذِي يُؤْتِي مَالَهُ يَتَزَكَّىٰ","yang menginfakkan hartanya (di jalan Allah) untuk membersihkan (dirinya),"],["وَمَا لِأَحَدٍ عِنْدَهُ مِنْ نِعْمَةٍ تُجْزَىٰ","dan tidak ada seorang pun memberikan suatu nikmat kepadanya yang harus dibalasnya,"],["إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَىٰ","tetapi (dia memberikan itu semata-mata) karena mencari keridaan Tuhannya Yang Mahatinggi."],["وَلَسَوْفَ يَرْضَىٰ","Dan niscaya kelak dia akan puas."]],
98:[["لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنْفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ","Orang-orang kafir dari golongan Ahli Kitab dan orang-orang musyrik tidak akan meninggalkan (agama mereka) sampai datang kepada mereka bukti yang nyata,"],["رَسُولٌ مِنَ اللَّهِ يَتْلُو صُحُفًا مُطَهَّرَةً","(yaitu) seorang Rasul dari Allah (Muhammad) yang membacakan lembaran-lembaran yang suci (Al-Qur’an),"],["فِيهَا كُتُبٌ قَيِّمَةٌ","di dalamnya terdapat (isi) kitab-kitab yang lurus."],["وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِنْ بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ","Dan tidaklah terpecah-belah orang-orang yang diberi Kitab (kepada Ahli Kitab) melainkan setelah datang kepada mereka bukti yang nyata."],["وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ ۚ وَذَٰلِكَ دِينُ الْقَيِّمَةِ","Padahal mereka hanya diperintah menyembah Allah dengan ikhlas menaati-Nya semata-mata karena (menjalankan) agama, dan juga agar melaksanakan salat dan menunaikan zakat; dan yang demikian itulah agama yang lurus (benar)."],["إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا ۚ أُولَٰئِكَ هُمْ شَرُّ الْبَرِيَّةِ","Sesungguhnya orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik (akan masuk) ke neraka Jahanam; mereka kekal di dalamnya. Mereka itu adalah seburuk-buruk makhluk."],["إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ","Sesungguhnya orang-orang yang beriman dan mengerjakan kebajikan, mereka itu adalah sebaik-baik makhluk."],["جَزَاؤُهُمْ عِنْدَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِنْ تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۖ رَضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُ","Balasan mereka di sisi Tuhan mereka ialah surga Adn yang mengalir di bawahnya sungai-sungai; mereka kekal di dalamnya selama-lamanya. Allah rida terhadap mereka dan mereka pun rida kepada-Nya. Demikian itu bagi orang yang takut kepada Tuhannya."]],
91:[["وَالشَّمْسِ وَضُحَاهَا","Demi matahari dan sinarnya pada pagi hari,"],["وَالْقَمَرِ إِذَا تَلَاهَا","demi bulan apabila mengiringinya,"],["وَالنَّهَارِ إِذَا جَلَّاهَا","demi siang apabila menampakkannya,"],["وَاللَّيْلِ إِذَا يَغْشَاهَا","demi malam apabila menutupinya (gelap gulita),"],["وَالسَّمَاءِ وَمَا بَنَاهَا","demi langit dan pembinaannya (yang menakjubkan),"],["وَالْأَرْضِ وَمَا طَحَاهَا","demi bumi dan penghamparannya,"],["وَنَفْسٍ وَمَا سَوَّاهَا","demi jiwa serta penyempurnaan (ciptaan)nya,"],["فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا","maka Dia mengilhamkan kepada jiwa itu (jalan) kefasikan dan ketakwaannya,"],["قَدْ أَفْلَحَ مَنْ زَكَّاهَا","sungguh beruntung orang yang menyucikannya (jiwa itu),"],["وَقَدْ خَابَ مَنْ دَسَّاهَا","dan sungguh rugi orang yang mengotorinya."],["كَذَّبَتْ ثَمُودُ بِطَغْوَاهَا","(Kaum) Samud telah mendustakan (rasulnya) karena mereka melampaui batas (kezaliman),"],["إِذِ انْبَعَثَ أَشْقَاهَا","ketika bangkit orang yang paling celaka di antara mereka,"],["فَقَالَ لَهُمْ رَسُولُ اللَّهِ نَاقَةَ اللَّهِ وَسُقْيَاهَا","lalu Rasul Allah (Saleh) berkata kepada mereka, “(Biarkanlah) unta betina milik Allah ini dan minumannya.”"],["فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُمْ بِذَنْبِهِمْ فَسَوَّاهَا","Namun mereka mendustakannya dan menyembelih unta itu, maka Tuhan membinasakan mereka disebabkan dosa mereka, lalu Dia meratakan mereka (dengan tanah),"],["وَلَا يَخَافُ عُقْبَاهَا","dan Dia tidak takut terhadap akibatnya."]],
100:[["وَالْعَادِيَاتِ ضَبْحًا","Demi kuda perang yang berlari kencang terengah-engah,"],["فَالْمُورِيَاتِ قَدْحًا","dan kuda yang memercikkan bunga api (dengan pukulan kuku kakinya),"],["فَالْمُغِيرَاتِ صُبْحًا","dan kuda yang menyerang dengan tiba-tiba pada waktu pagi,"],["فَأَثَرْنَ بِهِ نَقْعًا","sehingga menerbangkan debu,"],["فَوَسَطْنَ بِهِ جَمْعًا","lalu menyerbu ke tengah-tengah kumpulan musuh,"],["إِنَّ الْإِنْسَانَ لِرَبِّهِ لَكَنُودٌ","sungguh, manusia itu sangat ingkar (tidak bersyukur) kepada Tuhannya,"],["وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","dan sesungguhnya dia menyaksikan (sendiri) keingkarannya,"],["وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ","dan sungguh, cintanya kepada harta benar-benar berlebihan."],["أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ","Maka tidakkah dia mengetahui apabila apa yang ada di dalam kubur dikeluarkan,"],["وَحُصِّلَ مَا فِي الصُّدُورِ","dan apa yang tersimpan di dalam dada dilahirkan,"],["إِنَّ رَبَّهُمْ بِهِمْ يَوْمَئِذٍ لَخَبِيرٌ","sungguh, Tuhan mereka pada hari itu Mahateliti terhadap keadaan mereka."]],
99:[["إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا","Apabila bumi diguncangkan dengan guncangan yang dahsyat,"],["وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا","dan bumi telah mengeluarkan beban-beban beratnya,"],["وَقَالَ الْإِنْسَانُ مَا لَهَا","dan manusia bertanya, “Apa yang terjadi pada bumi ini?”"],["يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","pada hari itu bumi menceritakan beritanya,"],["بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","karena sesungguhnya Tuhanmu telah memerintahkan (yang demikian itu) kepadanya."],["يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِيُرَوْا أَعْمَالَهُمْ","Pada hari itu manusia keluar (dari kuburnya) dalam keadaan berkelompok-kelompok untuk diperlihatkan kepada mereka (balasan) perbuatan mereka."],["فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ","Maka barangsiapa mengerjakan kebaikan seberat zarrah, niscaya dia akan melihat (balasan)nya,"],["وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ","dan barangsiapa mengerjakan kejahatan seberat zarrah, niscaya dia akan melihat (balasan)nya pula."]],
101:[["الْقَارِعَةُ","Hari Kiamat,"],["مَا الْقَارِعَةُ","apakah hari Kiamat itu?"],["وَمَا أَدْرَاكَ مَا الْقَارِعَةُ","Dan tahukah engkau apakah hari Kiamat itu?"],["يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ","Pada hari itu manusia seperti laron yang beterbangan,"],["وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنْفُوشِ","dan gunung-gunung seperti bulu yang dihambur-hamburkan."],["فَأَمَّا مَنْ ثَقُلَتْ مَوَازِينُهُ","Maka adapun orang yang berat timbangan (kebaikan)nya,"],["فَهُوَ فِي عِيشَةٍ رَاضِيَةٍ","maka dia berada dalam kehidupan yang menyenangkan."],["وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ","Dan adapun orang yang ringan timbangan (kebaikan)nya,"],["فَأُمُّهُ هَاوِيَةٌ","maka tempat kembalinya adalah neraka Hawiyah."],["وَمَا أَدْرَاكَ مَا هِيَهْ","Dan tahukah engkau apakah neraka Hawiyah itu?"],["نَارٌ حَامِيَةٌ","(Yaitu) api yang sangat panas."]],
102:[["أَلْهَاكُمُ التَّكَاثُرُ","Bermegah-megahan telah melalaikan kamu,"],["حَتَّىٰ زُرْتُمُ الْمَقَابِرَ","sampai kamu masuk ke dalam kubur."],["كَلَّا سَوْفَ تَعْلَمُونَ","Sekali-kali tidak! Kelak kamu akan mengetahui,"],["ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ","kemudian sekali-kali tidak! Kelak kamu akan mengetahui."],["كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ","Sekali-kali tidak! Sekiranya kamu mengetahui dengan pasti,"],["لَتَرَوُنَّ الْجَحِيمَ","niscaya kamu benar-benar akan melihat (neraka) Jahim,"],["ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ","kemudian kamu benar-benar akan melihatnya dengan mata kepala sendiri,"],["ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ","kemudian kamu pasti akan ditanya pada hari itu tentang kenikmatan (yang megah di dunia itu)."]],
93:[["وَالضُّحَىٰ","Demi waktu dhuha (ketika matahari naik sepenggalah),"],["وَاللَّيْلِ إِذَا سَجَىٰ","dan demi malam apabila telah sunyi,"],["مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","Tuhanmu tidak meninggalkan engkau (Muhammad) dan tidak (pula) membencimu,"],["وَلَلْآخِرَةُ خَيْرٌ لَكَ مِنَ الْأُولَىٰ","dan sungguh, yang kemudian itu lebih baik bagimu daripada yang permulaan."],["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","Dan sungguh, kelak Tuhanmu pasti memberikan karunia-Nya kepadamu sehingga engkau menjadi puas."],["أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ","Bukankah Dia mendapatimu sebagai seorang yatim, lalu Dia melindungimu?"],["وَوَجَدَكَ ضَالًّا فَهَدَىٰ","Dan Dia mendapatimu sebagai seorang yang bingung, lalu Dia memberikan petunjuk,"],["وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ","dan Dia mendapatimu sebagai seorang yang kekurangan, lalu Dia memberikan kecukupan."],["فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ","Maka terhadap anak yatim, janganlah engkau berlaku sewenang-wenang."],["وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ","Dan terhadap orang yang meminta-minta, janganlah engkau menghardiknya."],["وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ","Dan terhadap nikmat Tuhanmu, hendaklah engkau menyebut-nyebutnya (dengan bersyukur)."]],
94:[["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","Bukankah Kami telah melapangkan dadamu (Muhammad)?"],["وَوَضَعْنَا عَنْكَ وِزْرَكَ","Dan Kami pun telah menurunkan bebanmu darimu,"],["الَّذِي أَنْقَضَ ظَهْرَكَ","yang memberatkan punggungmu,"],["وَرَفَعْنَا لَكَ ذِكْرَكَ","dan Kami tinggikan sebutan (nama)mu bagimu."],["فَإِنَّ مَعَ الْعُسْرِ يُسْرًا","Maka sesungguhnya beserta kesulitan ada kemudahan,"],["إِنَّ مَعَ الْعُسْرِ يُسْرًا","sesungguhnya beserta kesulitan ada kemudahan."],["فَإِذَا فَرَغْتَ فَانْصَبْ","Maka apabila engkau telah selesai (dari suatu urusan), tetaplah bekerja keras (untuk urusan yang lain),"],["وَإِلَىٰ رَبِّكَ فَارْغَبْ","dan hanya kepada Tuhanmulah engkau berharap."]],
95:[["وَالتِّينِ وَالزَّيْتُونِ","Demi (buah) Tin dan (buah) Zaitun,"],["وَطُورِ سِينِينَ","demi gunung Sinai,"],["وَهَٰذَا الْبَلَدِ الْأَمِينِ","dan demi negeri (Mekah) yang aman ini."],["لَقَدْ خَلَقْنَا الْإِنْسَانَ فِي أَحْسَنِ تَقْوِيمٍ","Sungguh, Kami telah menciptakan manusia dalam bentuk yang sebaik-baiknya."],["ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ","Kemudian Kami kembalikan dia ke tempat yang serendah-rendahnya (neraka),"],["إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","kecuali orang-orang yang beriman dan mengerjakan kebajikan; maka mereka mendapat pahala yang tidak putus-putusnya."],["فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ","Maka apa yang menyebabkan engkau mendustakan (hari) pembalasan setelah (adanya keterangan) itu?"],["أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ","Bukankah Allah hakim yang paling adil?"]],
97:[["إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ","Sungguh, Kami telah menurunkannya (Al-Qur’an) pada malam qadar."],["وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ","Dan tahukah engkau apakah malam qadar itu?"],["لَيْلَةُ الْقَدْرِ خَيْرٌ مِنْ أَلْفِ شَهْرٍ","Malam qadar itu lebih baik daripada seribu bulan."],["تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِمْ مِنْ كُلِّ أَمْرٍ","Pada malam itu turun para malaikat dan Jibril dengan izin Tuhannya untuk mengatur semua urusan."],["سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ","Sejahteralah (malam) itu sampai terbit fajar."]],
104:[["وَيْلٌ لِكُلِّ هُمَزَةٍ لُمَزَةٍ","Celakalah setiap pengumpat dan pencela,"],["الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ","yang mengumpulkan harta dan menghitung-hitungnya,"],["يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ","dia mengira bahwa hartanya dapat mengekalkannya."],["كَلَّا لَيُنْبَذَنَّ فِي الْحُطَمَةِ","Sekali-kali tidak! Pasti dia akan dilemparkan ke dalam Huthamah."],["وَمَا أَدْرَاكَ مَا الْحُطَمَةُ","Dan tahukah engkau apa Huthamah itu?"],["نَارُ اللَّهِ الْمُوقَدَةُ","(Yaitu) api (azab) Allah yang dinyalakan,"],["الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ","yang (membakar) sampai ke hati."],["إِنَّهَا عَلَيْهِمْ مُؤْصَدَةٌ","Sungguh, api itu ditutup rapat atas mereka,"],["فِي عَمَدٍ مُمَدَّدَةٍ","(sedang mereka diikat) pada tiang-tiang yang panjang."]],
105:[["أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ","Tidakkah engkau (Muhammad) perhatikan bagaimana Tuhanmu telah bertindak terhadap pasukan bergajah?"],["أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","Bukankah Dia telah menjadikan tipu daya mereka itu sia-sia?"],["وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","Dan Dia mengirimkan kepada mereka burung yang berbondong-bondong,"],["تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ","yang melempari mereka dengan batu dari tanah yang terbakar,"],["فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ","lalu Dia menjadikan mereka seperti daun-daun yang dimakan (ulat)."]],
107:[["أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ","Tahukah engkau orang yang mendustakan agama?"],["فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ","Maka itulah orang yang menghardik anak yatim,"],["وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ","dan tidak mendorong memberi makan orang miskin."],["فَوَيْلٌ لِلْمُصَلِّينَ","Maka celakalah orang yang salat,"],["الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ","(yaitu) orang-orang yang lalai terhadap salatnya,"],["الَّذِينَ هُمْ يُرَاءُونَ","yang berbuat riya,"],["وَيَمْنَعُونَ الْمَاعُونَ","dan enggan (memberikan) bantuan."]],
111:[["تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ","Binasalah kedua tangan Abu Lahab dan benar-benar binasa dia."],["مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ","Tidaklah berguna baginya hartanya dan apa yang dia usahakan."],["سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ","Kelak dia akan masuk ke dalam api yang bergejolak (neraka)."],["وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ","Demikian pula istrinya, pembawa kayu bakar."],["فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ","Di lehernya ada tali dari sabut yang dipintal."]],
103:[["وَالْعَصْرِ","Demi masa."],["إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ","Sungguh, manusia benar-benar berada dalam kerugian,"],["إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ","kecuali orang yang beriman, mengerjakan kebajikan, saling menasihati untuk kebenaran dan saling menasihati untuk kesabaran."]],
106:[["لِإِيلَافِ قُرَيْشٍ","Karena kebiasaan orang-orang Quraisy,"],["إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ","yaitu kebiasaan mereka bepergian pada musim dingin dan musim panas."],["فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ","Maka hendaklah mereka menyembah Tuhan pemilik rumah ini (Ka’bah),"],["الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ","yang telah memberi makanan kepada mereka untuk menghilangkan lapar dan mengamankan mereka dari rasa takut."]],
108:[["إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","Sungguh, Kami telah memberimu nikmat yang banyak."],["فَصَلِّ لِرَبِّكَ وَانْحَرْ","Maka laksanakanlah salat karena Tuhanmu, dan berkurbanlah."],["إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ","Sungguh, orang yang membencimu dialah yang terputus."]],
109:[["قُلْ يَا أَيُّهَا الْكَافِرُونَ","Katakanlah (Muhammad), “Wahai orang-orang kafir!"],["لَا أَعْبُدُ مَا تَعْبُدُونَ","Aku tidak akan menyembah apa yang kamu sembah,"],["وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ","dan kamu bukan penyembah apa yang aku sembah."],["وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ","Aku tidak pernah menjadi penyembah apa yang kamu sembah,"],["وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ","dan kamu tidak pernah (pula) menjadi penyembah apa yang aku sembah."],["لَكُمْ دِينُكُمْ وَلِيَ دِينِ","Untukmu agamamu, dan untukkulah agamaku.”"]],
110:[["إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","Apabila telah datang pertolongan Allah dan kemenangan,"],["وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","dan engkau melihat manusia berbondong-bondong masuk agama Allah,"],["فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا","maka bertasbihlah dengan memuji Tuhanmu dan mohonlah ampun kepada-Nya. Sungguh, Dia Maha Penerima tobat."]],
112:[["قُلْ هُوَ اللَّهُ أَحَدٌ","Katakanlah (Muhammad), “Dialah Allah, Yang Maha Esa."],["اللَّهُ الصَّمَدُ","Allah tempat meminta segala sesuatu."],["لَمْ يَلِدْ وَلَمْ يُولَدْ","(Allah) tidak beranak dan tidak pula diperanakkan."],["وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ","Dan tidak ada sesuatu yang setara dengan Dia.”"]],
113:[["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","Katakanlah, “Aku berlindung kepada Tuhan yang menguasai subuh (fajar),"],["مِنْ شَرِّ مَا خَلَقَ","dari kejahatan (makhluk yang) Dia ciptakan,"],["وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ","dan dari kejahatan malam apabila telah gelap gulita,"],["وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ","dan dari kejahatan perempuan-perempuan penyihir yang meniup pada buhul-buhul (talinya),"],["وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ","dan dari kejahatan orang yang dengki apabila dia dengki.”"]],
114:[["قُلْ أَعُوذُ بِرَبِّ النَّاسِ","Katakanlah, “Aku berlindung kepada Tuhannya manusia,"],["مَلِكِ النَّاسِ","Rajanya manusia,"],["إِلَٰهِ النَّاسِ","Sembahan manusia,"],["مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","dari kejahatan (bisikan) setan yang bersembunyi,"],["الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ","yang membisikkan (kejahatan) ke dalam dada manusia,"],["مِنَ الْجِنَّةِ وَالنَّاسِ","dari (golongan) jin dan manusia.”"]]

107:["Ara’aitalladzii yukadzdzibu bid-diin.","Fadzaalikalladzii yadu‘‘ul-yatiim.","Wa laa yahudhdhu ‘alaa tha‘aamil-miskiin.","Fawailul lil-mushalliin.","Alladziina hum ‘an shalaatihim saahuun.","Alladziina hum yuraa’uun.","Wa yamna‘uunal-maa‘uun."],
111:["Tabbat yadaa abii lahabiw wa tabb.","Maa aghnaa ‘anhu maaluhuu wa maa kasab.","Sayashlaa naaran dzaata lahab.","Wamra’atuhuu hammaalatal-hathab.","Fii jiidihaa hablum min masad."],
103:["Wal-‘ashr.","Innal-insaana lafii khusr.","Illal-ladziina aamanuu wa ‘amilush-shaalihaati wa tawaashau bil-haqqi wa tawaashau bish-shabr."],
106:["Li iilaafi quraisy.","Iilaafihim rihlatasy-syitaa’i wash-shaif.","Falya’buduu rabba haadzal-bait.","Alladzii ath’amahum min juu’in wa aamanahum min khauf."],
108:["Innaa a’thainaakal-kautsar.","Fashalli lirabbika wanhar.","Inna syaani’aka huwal-abtar."],
109:["Qul yaa ayyuhal-kaafiruun.","Laa a’budu maa ta’buduun.","Wa laa antum ‘aabiduuna maa a’bud.","Wa laa ana ‘aabidum maa ‘abattum.","Wa laa antum ‘aabiduuna maa a’bud.","Lakum diinukum wa liya diin."],
110:["Idzaa jaa’a nashrullaahi wal-fath.","Wa ra’aitan-naasa yadkhuluuna fii diinillaahi afwaajaa.","Fa sabbih bihamdi rabbika wastaghfirhu, innahuu kaana tawwaabaa."],
112:["Qul huwallaahu ahad.","Allaahush-shamad.","Lam yalid wa lam yuulad.","Wa lam yakul lahuu kufuwan ahad."],
113:["Qul a’uudzu birabbil-falaq.","Min syarri maa khalaq.","Wa min syarri ghaasiqin idzaa waqab.","Wa min syarrin-naffaatsaati fil-‘uqad.","Wa min syarri haasidin idzaa hasad."],
114:["Qul a’uudzu birabbin-naas.","Malikin-naas.","Ilaahin-naas.","Min syarril-waswaasil-khannaas.","Alladzii yuwaswisu fii shuduurin-naas.","Minal-jinnati wan-naas."]
};
var app=document.getElementById("app"),H={};
try{H=JSON.parse(localStorage.getItem("hafal")||"{}")}catch(e){H={}}
function save(){try{localStorage.setItem("hafal",JSON.stringify(H))}catch(e){}}
function find(n){return S.filter(function(s){return s[0]==n})[0]}
function list(){
  var done=S.filter(function(s){return H[s[0]]}).length,p=Math.round(done/S.length*100);
  var h='<h1>Hafalan Juz 30</h1><p class="sub">37 surah, dari An-Naba’ sampai An-Nas.</p><div class="bar"><i style="width:'+p+'%"></i></div><p class="hint">'+done+' dari 37 surah sudah hafal ('+p+'%)</p>';
  S.forEach(function(s){
    var ok=!!T[s[0]];
    h+='<div class="item'+(ok?'':' off')+'" '+(ok?'onclick="location.hash=\'s'+s[0]+'\'"':'')+'><span class="no">'+s[0]+'</span><span><b>'+s[1]+'</b><small>'+s[2]+' ayat</small></span><span class="tag">'+(H[s[0]]?'✓ hafal':(ok?'Mulai →':'Segera'))+'</span></div>';
  });
  h+='<p class="hint">Teks tersedia untuk 27 surah. Surah lainnya ditambahkan bertahap.</p>';
  app.innerHTML=h;
}
var hide=false,tr=true,lt=true;
function detail(n){
  var s=find(n),a=T[n];
  if(!s||!a){location.hash="";return}
  var h='<a class="back" href="#">← Semua surah</a><h1>'+s[1]+'</h1><p class="sub">Surah ke-'+s[0]+' · '+s[2]+' ayat</p>';
  h+='<div class="row"><button id="b1" class="'+(hide?'on':'')+'">Mode hafalan</button><button id="bl" class="'+(lt?'on':'')+'">Latin</button><button id="b2" class="'+(tr?'on':'')+'">Terjemahan</button><button id="b3" class="'+(H[n]?'on':'')+'">'+(H[n]?'✓ Sudah hafal':'Tandai hafal')+'</button></div>';
  h+='<p class="hint" id="hn">'+(hide?'Ketuk ayat untuk melihatnya setelah mencoba mengingat.':'Aktifkan mode hafalan untuk menyembunyikan ayat.')+'</p>';
  h+='<div id="ay" class="'+(hide?'hide ':'')+(tr?'':'noTr ')+(lt?'':'noLt')+'">';
  a.forEach(function(v,i){h+='<div class="ayat"><span class="n">Ayat '+(i+1)+'</span><p class="ar">'+v[0]+'</p><p class="lat">'+((L[n]||[])[i]||'')+'</p><p class="tr">'+v[1]+'</p></div>'});
  h+='</div>';
  app.innerHTML=h;
  var ay=document.getElementById("ay");
  ay.onclick=function(e){var t=e.target.closest(".ayat");if(t&&hide)t.classList.toggle("show")};
  document.getElementById("b1").onclick=function(){hide=!hide;detail(n)};
  document.getElementById("b2").onclick=function(){tr=!tr;detail(n)};
  document.getElementById("bl").onclick=function(){lt=!lt;detail(n)};
  document.getElementById("b3").onclick=function(){H[n]=!H[n];save();detail(n)};
}
function route(){
  var m=/^#s(\d+)$/.exec(location.hash);
  if(m)detail(+m[1]);else list();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
